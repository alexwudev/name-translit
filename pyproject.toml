[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "name-translit"
version = "2.0.0"
description = "Place/person name transliteration into Chinese for Finnish, Russian, Indonesian, English, French, German, Spanish, Persian and Arabic, following the zh.wikipedia transliteration tables"
requires-python = ">=3.9"
dependencies = ["opencc-python-reimplemented"]
license = { text = "CC-BY-SA-4.0" }

[project.scripts]
name-translit = "name_translit.cli:main"

[tool.setuptools]
packages = ["name_translit"]
include-package-data = true

[tool.setuptools.package-data]
name_translit = ["langs/*"]
